# 单人项目交付规范 —— 卡点配置
# 对应 standard.md v1.0。路径相对项目根，命令用正斜杠，shell=False 执行，
# 因此不要在这里写 > 或 2>&1（输出重定向由 gate.py 接管）。

[paths]
spec_dir = "specs"
evidence_dir = "evidence"


# ------------------------------------------------------------------ 自举单元
# 用规范验收规范自身。AC-03 是负向验证：证明判定器确实会说不。

[units.delivery-standard]
tier = "T2"
build = ["python -m py_compile delivery-standard/tools/gate.py"]

[[units.delivery-standard.evidence]]
ac = "AC-01"
cmd = "python -m py_compile delivery-standard/tools/gate.py"

[[units.delivery-standard.evidence]]
ac = "AC-02"
cmd = "python delivery-standard/tools/gate.py doctor"

[[units.delivery-standard.evidence]]
ac = "AC-03"
cmd = "python delivery-standard/tools/gate.py g1 --unit __negative__"
expect = 1

[[units.delivery-standard.evidence]]
ac = "AC-04"
cmd = "python delivery-standard/tools/gate.py selftest"

[[units.delivery-standard.evidence]]
ac = "AC-05"
cmd = "python delivery-standard/tests/t_g3_exit.py"


# ------------------------------------------------------------------ 真实模块
# cmake / ninja 不在 PATH，路径取自 natdiag/build/CMakeCache.txt 的 CMAKE_COMMAND。

[units.natdiag]
tier = "T2"
build = ["C:/vcpkg-tools/cmake/cmake-4.4.4-windows-x86_64/bin/cmake.exe --build natdiag/build"]

[[units.natdiag.evidence]]
ac = "AC-01"
cmd = "natdiag/build/natdiag-tests.exe"


# ------------------------------------------------------------------ M1b 引擎
# 构建走 toolchain/build.py：它自带 MSVC 环境（vcvars 因 reg.exe 黑名单不可用），
# 因此在任何 shell 里都能跑，不要求调用方先 source 什么。
# 证据命令全部是「自起自停」的 Python 脚本：脚本内部拉起引擎、断言、收尾，
# 外部只需看退出码。这样 AC 才能保持「一条命令可判定」的形态。

[units.engine-service]
tier = "T2"
build = ["python toolchain/build.py engine"]

[[units.engine-service.evidence]]
ac = "AC-01"
cmd = "python toolchain/build.py engine"

[[units.engine-service.evidence]]
ac = "AC-02"
cmd = "python engine/tests/t_single_instance.py"

[[units.engine-service.evidence]]
ac = "AC-03"
cmd = "python engine/tests/t_auth.py"

[[units.engine-service.evidence]]
ac = "AC-04"
cmd = "python engine/tests/t_health.py"
[[units.engine-service.evidence]]
ac = "AC-05"
cmd = "python engine/tests/t_add_magnet.py"

[[units.engine-service.evidence]]
ac = "AC-06"
cmd = "python engine/tests/t_pause_resume.py"

[[units.engine-service.evidence]]
ac = "AC-07"
cmd = "python engine/tests/t_delete.py"

[[units.engine-service.evidence]]
ac = "AC-08"
cmd = "python engine/tests/t_restart.py"

[[units.engine-service.evidence]]
ac = "AC-09"
cmd = "python engine/tests/t_latency.py"

[[units.engine-service.evidence]]
ac = "AC-10"
cmd = "python engine/tests/t_bind_loopback.py"

[[units.engine-service.evidence]]
ac = "AC-11"
cmd = "python engine/tests/t_malformed.py"

[[units.engine-service.evidence]]
ac = "AC-12"
cmd = "python engine/tests/t_nat_field.py"

# M2b 追加：浏览器跨源。缺 CORS 头时引擎侧没有任何日志（预检都没到），
# 现场只表现为「界面永远转圈」，所以必须有断言锁住。
[[units.engine-service.evidence]]
ac = "AC-13"
cmd = "python engine/tests/t_cors.py"

# 非 ASCII 数据目录下端点文件必须是合法 UTF-8。曾经的缺陷：引擎把 GBK 字节写进 JSON，
# 壳按 UTF-8 读失败，表现是「应用打开了但一直转圈」，两侧日志都无错。
[[units.engine-service.evidence]]
ac = "AC-14"
cmd = "python engine/tests/t_path_encoding.py"

# delete_files 的真实语义。AC-07 只验「任务从 /state 消失」，文件系统从来没验过。
# 这条会造三个真文件、真占用其中一个，看文件到底删没删掉。
[[units.engine-service.evidence]]
ac = "AC-15"
cmd = "python engine/tests/t_delete_files.py"

# 加任务即落盘 + 硬杀重启后仍在。用 taskkill 真杀进程，不是优雅退出。
[[units.engine-service.evidence]]
ac = "AC-16"
cmd = "python engine/tests/t_persist_crash.py"

# /state 的 total_bytes 曾经只在「下载中」正确，「已完成」塌成 0。
# 这条必须同时断言两种状态：只测下载中的话，把实现改回去依然全绿。
[[units.engine-service.evidence]]
ac = "AC-17"
cmd = "python engine/tests/t_total_bytes.py"

# 两个引擎之间真传 32 MiB。其余测试全是零 peer 的，「收到别人的数据并写对」
# 这件事此前没有任何判据碰过。必须带 --no-network：开着 LSD 时同机会自己配对，
# 会绕过 tracker，判据就再也变不红（实测过）。
[[units.engine-service.evidence]]
ac = "AC-18"
cmd = "python engine/tests/t_local_swarm.py"

# DHT 可观测性。在此之前引擎完全不暴露 DHT 状态，「无 tracker 的种子零 peer」
# 无法区分「DHT 没起来」与「DHT 起来了但这个 infohash 上没人」—— 两种处置完全不同。
# 不能读 session::status()：那个结构被 ABI v1 条件编译包住，本构建是 ABI v2。
[[units.engine-service.evidence]]
ac = "AC-19"
cmd = "python engine/tests/t_dht_status.py"

# 空闲时 seq 必须恒定，`?since=N` 才真的省得掉重绘。此前判定式写成 list + "|" + nat，
# nat 里的 sampled_seconds 每秒递增把 seq 一起推着涨，这条优化从来没生效过。
# 判据必须按「前端怎么用」写（A2 拿住 3 秒前的 seq 再问）：只按「接口怎么调」写
# （每拍重取当前 seq）时，两个请求落在同一个 100ms 重建窗口里，旧实现也全绿。
[[units.engine-service.evidence]]
ac = "AC-20"
cmd = "python engine/tests/t_state_seq.py"



# ------------------------------------------------------------- M2 桌面端
# 前端命令全部走 toolchain/build.py desktop：gate.py 用 shell=False 执行，
# 写不了 `cd desktop && npm x`；且 node 不在系统 PATH 里，包装器负责定位。

[units.desktop]
tier = "T2"
build = ["python toolchain/build.py desktop --build"]

[[units.desktop.evidence]]
ac = "AC-01"
cmd = "python toolchain/build.py desktop --install"

[[units.desktop.evidence]]
ac = "AC-02"
cmd = "python toolchain/build.py desktop --check"

[[units.desktop.evidence]]
ac = "AC-03"
cmd = "python toolchain/build.py desktop --test model"

[[units.desktop.evidence]]
ac = "AC-04"
cmd = "python toolchain/build.py desktop --test poller"

[[units.desktop.evidence]]
ac = "AC-05"
cmd = "python toolchain/build.py desktop --test virtual"

[[units.desktop.evidence]]
ac = "AC-06"
cmd = "python desktop/tests/t_live_engine.py"

[[units.desktop.evidence]]
ac = "AC-07"
cmd = "python toolchain/build.py desktop --build"

[[units.desktop.evidence]]
ac = "AC-08"
cmd = "python desktop/tests/t_engine_discovery.py"

# 添加任务（M2d）。AC-09/AC-10 共用一条命令：校验与请求契约写在同一份单测里，
# 拆成两条命令只会让「跑一次」变两次，判定结果完全一样。
[[units.desktop.evidence]]
ac = "AC-09"
cmd = "python toolchain/build.py desktop --test add-task.test"

[[units.desktop.evidence]]
ac = "AC-10"
cmd = "python toolchain/build.py desktop --test add-task.test"

[[units.desktop.evidence]]
ac = "AC-11"
cmd = "python toolchain/build.py desktop --test add-task-ui"

# 真引擎 + 真前端调用：前端 addTorrent() 发出的请求被引擎接受、任务出现在列表里
[[units.desktop.evidence]]
ac = "AC-12"
cmd = "python desktop/tests/t_add_task_live.py"

# .torrent 文件那条链路。AC-13/AC-14 共用一份单测（校验与契约在同一个文件里）；
# AC-15 走真引擎，因为引擎对磁力与字节走的是两个不同分支。
[[units.desktop.evidence]]
ac = "AC-13"
cmd = "python toolchain/build.py desktop --test add-file.test"

[[units.desktop.evidence]]
ac = "AC-14"
cmd = "python toolchain/build.py desktop --test add-file.test"

[[units.desktop.evidence]]
ac = "AC-15"
cmd = "python desktop/tests/t_add_file_live.py"

# 任务操作（暂停/恢复/删除）。AC-16/AC-17 共用一份单测：请求契约与按钮决策
# 写在同一文件里，拆成两条命令只会让「跑一次」变两次，判定结果完全一样。
[[units.desktop.evidence]]
ac = "AC-16"
cmd = "python toolchain/build.py desktop --test row-action.test"

[[units.desktop.evidence]]
ac = "AC-17"
cmd = "python toolchain/build.py desktop --test row-action.test"

[[units.desktop.evidence]]
ac = "AC-18"
cmd = "python toolchain/build.py desktop --test row-action-ui"

# 真引擎：暂停 → 恢复 → 删除，靠轮询 /state 判定状态真的变了
[[units.desktop.evidence]]
ac = "AC-19"
cmd = "python desktop/tests/t_row_action_live.py"

# 拖拽添加。AC-20/AC-21 共用判定层的单测（路径判定与遮罩判定在同一个文件里）；
# AC-22 只验接线，不起真引擎 —— 拖入的文件最终走 AC-15 验过的同一条上传路径。
[[units.desktop.evidence]]
ac = "AC-20"
cmd = "python toolchain/build.py desktop --test drag-drop.test"

[[units.desktop.evidence]]
ac = "AC-21"
cmd = "python toolchain/build.py desktop --test drag-drop.test"

[[units.desktop.evidence]]
ac = "AC-22"
cmd = "python toolchain/build.py desktop --test drag-drop-ui"

# 引擎失联后的表现。AC-23 锁显示规则（可失效数据源，失败时点可控）；
# AC-24 真杀 engine.exe，证明真实链路会走到离线分支 —— stub 只能模拟
# 「fetch 抛错」，模拟不了「进程没了、端口没人接」。
[[units.desktop.evidence]]
ac = "AC-23"
cmd = "python toolchain/build.py desktop --test engine-offline"

[[units.desktop.evidence]]
ac = "AC-24"
cmd = "python desktop/tests/t_engine_crash.py"

# 轮询超时。AC-04 也跑这个文件（验去重），AC-25 验的是新增的四条超时用例：
# 没有超时的话「引擎假死」会让 inflight 永不释放，界面永久冻结在在线态。
[[units.desktop.evidence]]
ac = "AC-25"
cmd = "python toolchain/build.py desktop --test poller"

# 真实假死：裸 TCP 收下连接不回数据。用默认 fetch source（不是桩），
# 验的是「AbortSignal 能不能真的取消一个真实的 undici 请求」+ 墙钟耗时对不对。
[[units.desktop.evidence]]
ac = "AC-26"
cmd = "python desktop/tests/t_engine_hang.py"

# 删除的「部分完成」。AC-16/AC-18 验的是「发出去的东西对不对」，
# 这两条验「引擎说文件没删掉时，前端能不能把这句话传到用户眼前」。
[[units.desktop.evidence]]
ac = "AC-27"
cmd = "python toolchain/build.py desktop --test row-action"

[[units.desktop.evidence]]
ac = "AC-28"
cmd = "python toolchain/build.py desktop --test row-action-ui"

# ------------------------------------------------- 跨机测试包（P1 渲染与帧率）
# 这是「界面不卡」从断言变成数据的那个单元。M2a 的四条性能约束全在 jsdom 里判定，
# 而 jsdom 没有排版引擎与合成器 —— 它能证明「DOM 结构对」，不能证明「60fps」。
#
# build 两条缺一不可：先构建探针并内联成单文件，再装进测试包。
# AC-08 要求包内页面与构建产物字节一致，所以打包必须在验收之前跑完，
# 否则拿到的是上次遗留的旧页面。

# ------------------------------------------------------------- M2b Tauri 壳
# 顺序不能反：tauri-build 在编译期读 frontendDist，dist 不存在会直接失败。
#
# 引擎必须先重建：`tauri.conf.json` 把 `engine/build/engine.exe` 声明成 resource，
# `shell build --release` 会把它复制成 `target/release/engine.exe`，壳优先加载这份副本。
# 少了这一步，engine-service 那边刚构建的新引擎不会进壳，壳跑的是上一版二进制 ——
# 测试照样全绿，测的却是旧代码。2026-11-04 做 AC-08 负向验证时踩到过：
# 撤掉落盘后测试仍通过，查了半天才发现壳加载的是三小时前的 exe。
[units.tauri-shell]
tier = "T2"
build = [
    "python toolchain/build.py desktop --build",
    "python toolchain/build.py engine",
    "python toolchain/build.py shell build --release",
]

# 纯决策逻辑：三情形 + 端点文件降级。不需要引擎，秒级完成。
[[units.tauri-shell.evidence]]
ac = "AC-01"
cmd = "python toolchain/build.py shell test --release --lib"

# 真引擎：spawn → reuse → shutdown → respawn 全走一遍
[[units.tauri-shell.evidence]]
ac = "AC-02"
cmd = "python toolchain/build.py shell test --release --test live_engine"

[[units.tauri-shell.evidence]]
ac = "AC-03"
cmd = "python toolchain/build.py desktop --test config"

# 端到端：启动真壳，等前端回报首帧，再验优雅退出
[[units.tauri-shell.evidence]]
ac = "AC-04"
cmd = "python desktop/tests/t_shell_e2e.py"

[[units.tauri-shell.evidence]]
ac = "AC-05"
cmd = "python desktop/tests/t_shell_single.py"

[[units.tauri-shell.evidence]]
ac = "AC-06"
cmd = "python desktop/tests/t_shell_artifact.py"

# 壳被强杀后重启：孤儿引擎接管。含一个「只让第一条连接超时」的 TCP 代理，
# 用来在本机造出「引擎活着但探测没响应」—— 桩掉 health_ok 会跳过整个 TCP 判定。
[[units.tauri-shell.evidence]]
ac = "AC-07"
cmd = "python toolchain/build.py shell test --release --test restart_takeover"

# 真 exe 链路的「关了再打开」。AC-07 在 Rust 里直接调 resolve()，造不出「引擎和壳
# 一起没了」；t_persist_crash.py 只跑引擎、t_shell_e2e.py 只跑壳，谁都不覆盖
# 「壳起引擎 → 加任务 → 两者都被硬杀 → 重开」这条用户真正会走的路。
# AC-08/AC-09 共用一条命令：一个脚本跑两段，判定入口是同一个退出码。
[[units.tauri-shell.evidence]]
ac = "AC-08"
cmd = "python desktop/tests/t_shell_restart_e2e.py"

[[units.tauri-shell.evidence]]
ac = "AC-09"
cmd = "python desktop/tests/t_shell_restart_e2e.py"

# AC-10 与 AC-08/AC-09 共用同一条命令，测的是反面：那两条全程 `taskkill /F` 故意绕过
# 收尾，这条专门走 WM_CLOSE（点 ×），因为 RunEvent::Exit 里 spawn 和 reuse 两条分支
# 的结果完全相反（关掉引擎 / 留着引擎），只测一条时另一条错了不会有任何信号。
[[units.tauri-shell.evidence]]
ac = "AC-10"
cmd = "python desktop/tests/t_shell_restart_e2e.py"

[units.installer]
tier = "T2"
build = [
    "python toolchain/build.py desktop --build",
    "python toolchain/build.py shell bundle",
]

[[units.installer.evidence]]
ac = "AC-01"
cmd = "python desktop/tests/t_installer_build.py"

# 装到含空格的临时目录 → 从安装目录启动 → 断言 resource 路径与前端就绪
[[units.installer.evidence]]
ac = "AC-02"
cmd = "python desktop/tests/t_installer_install.py"

[[units.installer.evidence]]
ac = "AC-03"
cmd = "python desktop/tests/t_installer_install.py"

[[units.installer.evidence]]
ac = "AC-04"
cmd = "python desktop/tests/t_installer_install.py"

# AC-05 卸载
[[units.installer.evidence]]
ac = "AC-05"
cmd = "python desktop/tests/t_installer_uninstall.py"

# AC-06 判据是「装出来的目录里有什么」，必须真的装一次才能判
[[units.installer.evidence]]
ac = "AC-06"
cmd = "python desktop/tests/t_installer_install.py"

[units.crossmachine]
tier = "T2"
build = [
    "python toolchain/build.py desktop --perf",
    "python toolchain/build.py crossmachine",
]

# AC-01..AC-05 全在纯函数层，一条 vitest 命令覆盖五条断言
#（与 desktop 单元的 AC-03/04/05 同一做法：判定入口是一个退出码）
[[units.crossmachine.evidence]]
ac = "AC-01"
cmd = "python toolchain/build.py desktop --test perf"

[[units.crossmachine.evidence]]
ac = "AC-02"
cmd = "python toolchain/build.py desktop --test perf"

[[units.crossmachine.evidence]]
ac = "AC-03"
cmd = "python toolchain/build.py desktop --test perf"

[[units.crossmachine.evidence]]
ac = "AC-04"
cmd = "python toolchain/build.py desktop --test perf"

[[units.crossmachine.evidence]]
ac = "AC-05"
cmd = "python toolchain/build.py desktop --test perf"

# 内联脚本自带自包含校验，外链残留时退出码 3
[[units.crossmachine.evidence]]
ac = "AC-06"
cmd = "python toolchain/build.py desktop --perf"

# 真实浏览器：起本地服务 + headless Chrome，两条路径（http / file）各跑一次完整流程。
# 这一项证明「探针能跑」，不证明「性能达标」—— 帧率数值不参与判定。
[[units.crossmachine.evidence]]
ac = "AC-07"
cmd = "python desktop/tests/t_perf_headless.py"

# 刷新率校准与阈值推导同在纯函数层，仍是一条 vitest 命令覆盖两条断言
[[units.crossmachine.evidence]]
ac = "AC-10"
cmd = "python toolchain/build.py desktop --test perf"

[[units.crossmachine.evidence]]
ac = "AC-11"
cmd = "python toolchain/build.py desktop --test perf"

[[units.crossmachine.evidence]]
ac = "AC-08"
cmd = "python desktop/tests/t_crossmachine_pack.py"

# AC-09 与 AC-08 同一个判定入口：第 ⑨ 项专门验压缩包（条目集、逐条哈希、
# 时间戳固定、原样重打一致、旁附 .sha256 匹配）。分开列是因为它们是两件事：
# 目录形态完整不等于换机时被拷走的那个 zip 完整。
[[units.crossmachine.evidence]]
ac = "AC-09"
cmd = "python desktop/tests/t_crossmachine_pack.py"

# --------------------------------------------------------- 真机执行包（field-test）
# 这一单元的产物不是代码，是「拷到另一台电脑就能跑」的目录 + 说明书。
# 因此 build 是组装（含复制安装包与组装 zip），验收脚本事后核对目录、哈希与文档闭环。
#
# AC-02..AC-04 共用一个入口：它们是三件不同的事（真跑、能说不、文档不漏），
# 但判定都落在同一个脚本的退出码上，拆成三个命令只会让「跑一次」变三次。
[units.field-test]
tier = "T2"
build = [
    "python toolchain/build.py desktop --perf",
    "python toolchain/build.py crossmachine",
    # 先重打包安装包再组装 zip。NSIS 打包不幂等（同样的输入两次产出不同字节），
    # 所以只要有人在中间跑过 `shell bundle`，zip 里装的就会是旧包 —— 而
    # `t_fieldtest_pack.py` 只看 zip 与它自己的 .sha256 是否一致，发现不了这件事。
    # 真机拿到的将是一个和最终构建产物不同的安装包。
    "python toolchain/build.py shell bundle",
    "python toolchain/pack_handoff.py",
]

[[units.field-test.evidence]]
ac = "AC-01"
cmd = "python desktop/tests/t_fieldtest_pack.py"

[[units.field-test.evidence]]
ac = "AC-02"
cmd = "python desktop/tests/t_fieldtest_pack.py"

[[units.field-test.evidence]]
ac = "AC-03"
cmd = "python desktop/tests/t_fieldtest_pack.py"

[[units.field-test.evidence]]
ac = "AC-04"
cmd = "python desktop/tests/t_fieldtest_pack.py"

# ------------------------------------------------------------- 负向对照单元
# 故意不提供 specs/__negative__.md。AC-03 依赖它稳定失败，
# 以此证明 G1 不会对缺失输入误判为通过。

[units.__negative__]
tier = "T1"
build = ["python -c pass"]

# 构建必然失败的负向单元：用于验证 G2 不会把失败的命令判成通过。
# 注意：命令按 shell 规则分词（shell=False），含空格的参数必须加引号，
# 否则会被拆成多个参数——这条本身踩过一次坑。
[units.__failbuild__]
tier = "T1"
build = ['python -c "import sys;sys.exit(3)"']
